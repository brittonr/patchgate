schema_version = "1.4"
artifacts = [{ source = "/scenarios/structured-review-binding/model-metrics.json", destination = "model-metrics.json" }]

[metadata]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
docker_image = "patchgate-harbor:dev"
workdir = "/scenarios/structured-review-binding"
build_timeout_sec = 900.0

[environment.healthcheck]
command = "patchgate-eval setup structured-review-binding /scenarios/structured-review-binding"
timeout_sec = 900.0
start_period_sec = 0.0
retries = 1
