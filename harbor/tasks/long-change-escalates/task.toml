schema_version = "1.4"

[metadata]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
docker_image = "patchgate-harbor:dev"
workdir = "/scenarios/long-change-escalates"
build_timeout_sec = 900.0

[environment.healthcheck]
command = "python3 /opt/patchgate/harbor/scenarios.py setup long-change-escalates /scenarios/long-change-escalates"
timeout_sec = 900.0
start_period_sec = 0.0
retries = 1
