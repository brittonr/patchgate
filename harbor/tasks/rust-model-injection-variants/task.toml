schema_version = "1.4"
artifacts = [{ source = "/scenarios/rust-model-injection-variants/model-metrics.json", destination = "model-metrics.json" }]

[metadata]
coverage = "rust-model"

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "patchgate-harbor:dev"
workdir = "/scenarios/rust-model-injection-variants"
build_timeout_sec = 900.0

[environment.healthcheck]
command = "patchgate-eval setup rust-model-injection-variants /scenarios/rust-model-injection-variants"
timeout_sec = 900.0
start_period_sec = 0.0
retries = 1
