[package]
name = "patchgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "patchgate"
description = "A local model gate for Pijul changes"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
