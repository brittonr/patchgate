[package]
name = "patchgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "patchgate"
description = "A local model gate for Pijul changes"

[[bin]]
name = "patchgate"
path = "src/main.rs"

[[bin]]
name = "patchgate-eval"
path = "src/bin/patchgate-eval/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
toml = "0.8"
ureq = { version = "3", features = ["json"] }
